modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/pegek/Tombtweaks-modern/issues"

[[mods]]
modId="tombtweaks"
version="${file.jarVersion}"
displayName="TombTweaks"
authors="spege"
description='''
Tweaks for Corail Tombstone: items return to the slots they came from, unvisited graves slowly decay, the magic books get a cooldown, and grave keys can be made immune to Soulbound.
'''

[[dependencies.tombtweaks]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tombtweaks]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.20.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tombtweaks]]
    modId="tombstone"
    mandatory=true
    # Verified on 9.1.4 only. The mixins are required + defaultRequire 1, so a version
    # that changes serverTick / canEnchant / the setEnchant call will crash the game when the
    # class loads - better for Forge to refuse to start with a readable message about the
    # dependency.
    versionRange="[9.1.4,9.2)"
    ordering="AFTER"
    side="BOTH"

# The mixin configuration is NOT declared here: FML 47 does not read [[mixins]] (that is a
# NeoForge feature). It is registered by the MixinConfigs attribute in the jar manifest, added
# by MixinGradle from the mixin { config ... } block in build.gradle.
