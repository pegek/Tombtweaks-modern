plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin'   version '0.7.+'
}

version = '0.2.0'
group   = 'com.spege.tombtweaks'
base { archivesName = 'tombtweaks-1.20.1' }

// Do NOT add -proc:none. The Mixin annotation processor must run, because
// MixinBlockDecorativeGrave targets a Minecraft method and needs a refmap.
java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

// The shared core (Java 8, zero MC types) lives in ../core and is compiled in every MC
// version's build - the decision logic exists once, and its tests run on every JVM.
sourceSets {
    main { java { srcDir '../core/src/main/java' } }
    test { java { srcDir '../core/src/test/java' } }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { tombtweaks { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { tombtweaks { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'tombtweaks.refmap.json'
    config 'mixins.tombtweaks.json'
}

repositories {
    mavenCentral()
    // Tombstone is "All rights reserved", so its jar must NOT end up in the repo.
    // CurseMaven serves exactly the same file as CurseForge.
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'

    // Tombstone: deobf is required, because the MC references in its bytecode are SRG names.
    // Coordinate: curse.maven:<slug>-<projectId>:<fileId>. 243707 = corail-tombstone,
    // 9070062 = the file "Corail Tombstone 9.1.5 for 1.20.1" (previously 8606942 = 9.1.4).
    // Before changing the file: compare javap -p of the mixin target classes between versions
    // and count the calls in the methods with redirects - on 9.1.4 -> 9.1.5 everything is identical.
    // NOTE: fg.deobf(files(...)) does NOT work on ForgeGradle 6 - it silently supplies the
    // obfuscated jar (that is FG3 syntax).
    implementation fg.deobf('curse.maven:corail-tombstone-243707:9070062')

    // Mixin annotation processor - MixinGradle 0.7 does NOT add it by itself. Without this line the
    // build is silent and green, but the jar comes out without a refmap, and the redirect in
    // MixinBlockDecorativeGrave (target: the Minecraft method `use`, `m_6227_` at runtime) crashes
    // the game the first time the class is loaded. runClient will NOT show this, because in dev the
    // names are official - it only surfaces in a real instance. Proof that it works:
    // tombtweaks.refmap.json in build/libs/*.jar.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

// core is also compiled in the 1.16.5 build, i.e. on Java 8. Toolchain 17 would let
// var, List.of or a record through without a word - this task compiles core alone with --release 8
// and fails `check` when core stops being Java 8.
tasks.register('compileCoreJava8', JavaCompile) {
    source = fileTree('../core/src/main/java')
    classpath = files()
    // A custom task does not inherit the project's toolchain (Gradle runs on JDK 8, which does not
    // know --release), so we point at the compiler explicitly.
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
    destinationDirectory = layout.buildDirectory.dir('core-java8')
    options.release = 8
    options.encoding = 'UTF-8'
}
tasks.named('check') { dependsOn 'compileCoreJava8' }

tasks.withType(JavaCompile).configureEach {
    // Do NOT add -proc:none here - see the note at the top of this file.
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'TombTweaks',
            'Specification-Vendor'  : 'spege',
            'Specification-Version' : "${version}",
            'Implementation-Title'  : project.name,
            'Implementation-Version': "${version}",
            'Implementation-Vendor' : 'spege'
        ])
    }
}
