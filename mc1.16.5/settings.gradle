pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Sponge';         url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    // Lets Gradle find (or download) the Java 8 toolchain by itself. 0.8.0 is the newest
    // foojay convention plugin that still supports Gradle 7.6.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'tombtweaks'
